<!doctype html>
<html lang="ru">
  <body>
    <p>Здравствуйте.</p>
    <p>
      Кто-то запросил сброс пароля для входа в сервис учёта абонементов. Если
      это были вы, откройте ссылку и задайте новый пароль:
    </p>
    <p>
      <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
        >Задать новый пароль</a
      >
    </p>
    <p>
      Ссылка действует один час. Если вы не запрашивали сброс, ничего не
      делайте.
    </p>
  </body>
</html>
